[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtin-scanner"
version = "0.1.0"
description = "Production-ready Streamlit barcode scanner for supply chain contract line lookups."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "streamlit>=1.32.0",
    "pandas>=2.0.0",
    # binary: prebuilt libpq, so no system Postgres install is needed.
    # pool: the process-wide ConnectionPool core/store.py holds across
    # Streamlit reruns.
    "psycopg[binary,pool]>=3.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pyarrow>=15.0.0",
    "openpyxl>=3.1.0",
    # >=12.3.0 floor: 12.2.0 and earlier carry 13 known CVEs (ASVS-AUDIT.md item 6).
    "Pillow>=12.3.0",
    # OS-keychain-backed secret storage — see core/secrets.py. Cross-platform:
    # macOS Keychain, Windows Credential Locker, Secret Service (GNOME/KDE)
    # on Linux.
    "keyring>=25.0.0",
    # Encrypts the offline write queue and the contract-data cache at rest —
    # see core/offline_queue.py and data/loader.py. >=42.0.0 floor is a
    # deliberately current pin: this package is security-load-bearing here,
    # not an incidental transitive dependency.
    "cryptography>=42.0.0",
    # gitpython/starlette are transitive (via streamlit), not something this
    # app imports directly — pinned explicitly anyway because the versions
    # streamlit's own metadata allowed carried known CVEs (22 and 2
    # advisories respectively; ASVS-AUDIT.md item 6) and there is no
    # lockfile yet (finding #14) to otherwise guarantee a fresh install
    # picks the patched ones.
    "gitpython>=3.1.51",
    "starlette>=1.3.1",
]

[project.optional-dependencies]
# Needed only for DATA_SOURCE=fabric. Kept out of the core dependencies because
# pyodbc also requires the Microsoft ODBC driver to be installed at system
# level, which pip cannot do — see README → "Switching to the Fabric Lakehouse".
#
# azure-identity does the Azure AD sign-in in Python rather than delegating to
# the ODBC driver. This is not a preference: the driver's browser-based modes
# (ActiveDirectoryInteractive) are Windows-only, and on macOS the driver accepts
# the value then hangs until timeout. See data/loader.py → _fabric_access_token.
fabric = [
    "pyodbc>=5.1.0",
    "azure-identity>=1.19.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "engine*", "api*", "core*", "ui*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# ui/theme.py is a large embedded CSS/JS stylesheet — long selector/rule
# lines and font-stack declarations are the format, not a style lapse.
# data/loader.py's mock dataset (_load_mock_data_fallback) is a literal
# transcription of real contract-line rows, including long item
# descriptions — wrapping those mid-string would hurt readability more
# than the line length rule helps.
"ui/theme.py" = ["E501"]
"data/loader.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
