[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtin-scanner"
version = "0.1.0"
description = "Production-ready Streamlit barcode scanner for supply chain contract line lookups."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "streamlit>=1.32.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pyarrow>=15.0.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
# Needed only for DATA_SOURCE=fabric. Kept out of the core dependencies because
# pyodbc also requires the Microsoft ODBC driver to be installed at system
# level, which pip cannot do — see README → "Switching to the Fabric Lakehouse".
fabric = [
    "pyodbc>=5.1.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "engine*", "api*", "core*", "ui*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
