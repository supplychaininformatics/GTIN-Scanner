# .github/dependabot.yml
#
# Proactive version-update PRs (weekly) for both ecosystems this repo uses.
# This is separate from GitHub's "Dependabot alerts" (security vulnerability
# notifications) and "Dependabot security updates" (auto-PRs when an alert
# fires) — those are repository *settings*, not files, and can't be turned
# on from a PR. See ASVS-COMPLIANCE.md's "Needs infra action" list: enabling
# them is a one-click Settings → Security change someone with repo admin
# needs to make.
#
# requirements.lock.txt is regenerated by hand (see its own header) rather
# than by Dependabot — Dependabot updates requirements.txt/pyproject.toml's
# ranges, a human re-locks and re-runs pip-audit before committing the lock
# file, matching how every dependency bump in this repo's history so far
# has been verified.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
